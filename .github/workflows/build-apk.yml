name: Build APK (debug)

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan export template
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          ls -la /root/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/. ~/.local/share/godot/export_templates/
          ls -la ~/.local/share/godot/export_templates/

      - name: Buat debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /tmp/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Atur path Java dan Android SDK untuk Godot
        run: |
          JAVA_DIR="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(which javac || which java)")")")}"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          echo "JAVA_DIR=$JAVA_DIR"
          echo "SDK_DIR=$SDK_DIR"
          ls "$SDK_DIR" || true
          ls "$SDK_DIR/build-tools" || true
          for d in "$HOME/.config/godot" /root/.config/godot; do
            mkdir -p "$d"
            for f in editor_settings-4.3.tres editor_settings-4.tres; do
              printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\n' "$JAVA_DIR" "$SDK_DIR" > "$d/$f"
            done
          done

      - name: Import proyek
        run: |
          # Import pertama membangun cache; exit code boleh non-nol, ekspor di bawah yang menentukan.
          godot --headless --verbose --import || true

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/dapur-keliling-dunia.apk

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: dapur-keliling-dunia-apk
          path: build/android/dapur-keliling-dunia.apk
